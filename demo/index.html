<!doctype html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Complot demo</title>
<style>
:root{
  --bg:#f4f1e8;--panel:#fffdf8;--panel-2:#faf6ec;--ink:#2a2a24;--muted:#6f6a5c;--line:#e4ddcc;
  --accent:#3f7d4e;--accent-soft:#e2eee0;--ochre:#c2833a;--warn:#b9502c;--warn-soft:#fae7de;
  --info:#3a6ea5;--info-soft:#e3ecf6;--soil:#dccbab;--soil-dark:#b9a37c;--side:#2e4834;
  --shadow:0 1px 2px rgba(60,50,30,.06),0 6px 18px rgba(60,50,30,.07);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:0 0 10px}h3{font-size:12.5px;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:12px}.num{font-variant-numeric:tabular-nums;text-align:right}
button,.btn{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;cursor:pointer;color:var(--ink);white-space:nowrap}
button:hover{border-color:var(--soil-dark)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:transparent;border-color:transparent}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:#fff;color:var(--ink);min-width:0}
textarea{width:100%}
textarea.code{font-family:ui-monospace,Consolas,monospace;font-size:12px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
label.f>*{color:var(--ink);font-size:14px}

.app{display:grid;grid-template-columns:200px 1fr;height:100vh}
.side{background:var(--side);color:#e8efe4;display:flex;flex-direction:column;padding:16px 10px;gap:2px}
.brand{font-weight:800;font-size:21px;padding:2px 10px 18px;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:11px;opacity:.6;letter-spacing:.05em;text-transform:uppercase}
.side a{padding:9px 12px;border-radius:8px;cursor:pointer;color:inherit;text-decoration:none;display:flex;gap:10px;align-items:center}
.side a:hover{background:rgba(255,255,255,.07)}
.side a.active{background:rgba(255,255,255,.15);font-weight:600}
.side a .cnt{margin-left:auto;background:var(--warn);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:0 7px}
.side-foot{margin-top:auto;font-size:11px;opacity:.75;padding:10px;display:flex;flex-direction:column;gap:8px}
.side-foot select{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.2);font-size:12px}
.side-foot select option{color:#222}
main{overflow:hidden;position:relative;min-width:0}
.view{display:none;height:100%;overflow:auto}
.view.active{display:flex;flex-direction:column}

/* ---- timeline ---- */
.timeline-bar{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px 12px;display:flex;flex-direction:column;gap:8px;flex:none}
.tl-controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tl-date{margin-left:auto;display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.tl-track{position:relative;height:48px;user-select:none;touch-action:none;cursor:pointer}
.tl-year{position:absolute;top:0;height:48px;font-size:11px;font-weight:700;color:var(--muted);padding-left:5px;border-left:2px solid var(--soil-dark)}
.tl-m{position:absolute;top:17px;height:31px;font-size:10px;color:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;border-right:1px solid rgba(255,255,255,.7);overflow:hidden}
.s-winter{background:#dde6ee}.s-spring{background:#dfedd4}.s-summer{background:#f2e5bd}.s-autumn{background:#eed6bf}
.tl-today{position:absolute;top:14px;bottom:0;width:2px;margin-left:-1px;background:var(--warn);opacity:.7}
.tl-today span{position:absolute;top:-14px;left:3px;font-size:9px;color:var(--warn);font-weight:700;white-space:nowrap}
.tl-handle{position:absolute;top:12px;bottom:-5px;width:0;pointer-events:none}
.tl-handle::before{content:'';position:absolute;left:-1.5px;top:0;bottom:0;width:3px;background:var(--ink);border-radius:2px}
.tl-handle span{position:absolute;bottom:-3px;left:-8px;width:16px;height:16px;border-radius:50%;background:var(--ink);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.seasons-key{display:flex;gap:10px;font-size:11px;color:var(--muted)}
.seasons-key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.badge{font-size:11px;padding:2px 9px;border-radius:999px;font-weight:700;letter-spacing:.02em}
.b-past{background:#ebe6da;color:#6f6a5c}.b-now{background:var(--accent-soft);color:var(--accent)}.b-plan{background:var(--info-soft);color:var(--info)}

/* ---- map ---- */
.map-wrap{display:grid;grid-template-columns:1fr 420px;flex:1;min-height:0}
.map-canvas{position:relative;overflow:hidden;background:#e9ecdc;background-image:radial-gradient(rgba(80,90,50,.12) 1px,transparent 1px);background-size:22px 22px}
.map-canvas svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.map-canvas svg.panning{cursor:grabbing}
.map-canvas.design svg{cursor:default}
.map-canvas.design [data-obj]{cursor:move}
.map-zoom{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:4px}
.map-zoom button{width:34px;height:34px;padding:0;font-size:17px;box-shadow:var(--shadow)}
.map-tools{position:absolute;top:12px;left:12px;display:flex;gap:6px;align-items:center}
.map-tools .compass{background:var(--panel);border-radius:8px;padding:5px 9px;font-weight:700;font-size:12px;box-shadow:var(--shadow)}
.map-tools button{box-shadow:var(--shadow)}
.legend{position:absolute;left:12px;bottom:12px;background:rgba(255,253,248,.97);border-radius:12px;box-shadow:var(--shadow);width:290px;max-height:calc(100% - 80px);overflow:auto}
.lg-head{width:100%;display:flex;align-items:center;gap:8px;border:0;background:none;font-weight:700;padding:9px 12px;border-radius:12px}
.lg-head span{margin-left:auto;color:var(--muted);font-weight:500;font-size:12px}
.lg-body{padding:0 12px 12px;display:flex;flex-direction:column;gap:12px}
.lg-sec>b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:2px}
.lg-sec>small{display:block;color:var(--muted);font-size:11px;margin-bottom:5px;line-height:1.3}
.lg-row{display:flex;align-items:center;gap:9px;font-size:12px;line-height:1.3;margin:4px 0}
.lg-chips{display:flex;flex-wrap:wrap;gap:4px}
.sw{width:30px;height:18px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.2);background-color:#d8c6a2;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.sw-soil{background-image:radial-gradient(#b59d70 1px,transparent 1.6px);background-size:6px 6px}
.sw-dots{background-image:radial-gradient(rgba(255,255,255,.9) 1.5px,transparent 2px);background-size:6px 6px}
.sw-hatch{background-image:repeating-linear-gradient(45deg,rgba(80,60,30,.5) 0 1.3px,transparent 1.3px 5px)}
.sw-plan{background:#fff;border:1.5px dashed #333}
.sw-none{background:none;border:0}
.sw-warn{width:17px;height:17px;border-radius:50%;background:#b9502c;color:#fff;font-weight:800;font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.sw-tree{width:18px;height:18px;border-radius:50%;background:rgba(95,143,74,.45);border:1.5px solid #4d7339;margin:0 6px}
.panel{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px 18px 30px}
.plot-open{fill:#efe5cf;stroke:#c9b58c;stroke-width:.05}
.plot-greenhouse{fill:#e3eef1;stroke:#7fa6b5;stroke-width:.07}
.plot-orchard{fill:#e7eed6;stroke:#a5b67f;stroke-width:.05}
.plot-label{font-size:.42px;font-weight:700;fill:#5d5642}
.bed-outline{fill:none;stroke:#8c7650;stroke-width:.04}
.bed-outline.sel{stroke:var(--ink);stroke-width:.12}
.bed:hover .bed-outline{stroke:var(--ink);stroke-width:.08}
.bed,.tree{cursor:pointer}
.bed-id{font-size:.24px;font-weight:800;fill:#5d4a2c;opacity:.85}
.seg-label{font-size:.27px;text-anchor:middle;dominant-baseline:middle;font-weight:650;fill:#2a2a24;paint-order:stroke;stroke:rgba(255,255,255,.75);stroke-width:.06px;pointer-events:none}
.feat-label{font-size:.3px;fill:#4b5340;font-weight:600;pointer-events:none}
.path-label{font-size:.24px;fill:#6b5a3a;font-weight:600;opacity:.8;pointer-events:none}
.dim{font-size:.26px;fill:var(--accent);font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:.07px}
.tip{position:fixed;pointer-events:none;background:#2a2a24;color:#fff;font-size:12px;padding:7px 10px;border-radius:8px;z-index:50;display:none;max-width:280px;box-shadow:var(--shadow)}

/* ---- panel content ---- */
.p-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.p-head h2{font-size:19px;margin:0}
.p-head .x{margin-left:auto}
.kv{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.kv b{color:var(--ink);font-weight:600}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:9px;padding:7px 10px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;font-size:13px}
.item.click{cursor:pointer}.item.click:hover{border-color:var(--soil-dark)}
.item .r{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.warn{background:var(--warn-soft);border-color:#efc9b8}
.info{background:var(--info-soft);border-color:#c8d8ec}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c,#999) 18%,#fff);color:color-mix(in srgb,var(--c,#555) 75%,#000);border:1px solid color-mix(in srgb,var(--c,#999) 35%,#fff);font-weight:600;white-space:nowrap}
.ph{font-size:11px;padding:1px 7px;border-radius:999px;font-weight:700;background:#eee;color:#555}
.ph-young{background:#e7f2df;color:#4c7a33}.ph-growing{background:#d7ead0;color:#2f6a2f}.ph-harvest{background:#f6e2b4;color:#8a5b00}.ph-clearing{background:#ece4d6;color:#6d5d40}.ph-indoor{background:var(--info-soft);color:var(--info)}.ph-dormant{background:#e5e8ec;color:#56606b}
.gantt{width:100%;display:block;cursor:crosshair;background:var(--panel-2);border:1px solid var(--line);border-radius:10px}
.gantt text{font-size:10px;fill:#3b392f}
.form{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.form .row{display:flex;gap:8px;flex-wrap:wrap}.form .row>*{flex:1}
.calc{font-size:12.5px;display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
.calc span:nth-child(odd){color:var(--muted)}
.note{padding:8px 10px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;font-size:13px}
.note .h{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:3px}
.note img{max-width:100%;border-radius:8px;margin-top:6px}
.note.disease,.note.pest{border-color:#efc9b8;background:#fdf3ee}
.ds-add{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.ds-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ds-grid .full{grid-column:1/-1}
.ds-act{display:grid;grid-template-columns:1fr 70px 70px 30px;gap:5px;align-items:center}

/* ---- tasks ---- */
.task{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.task+.task{margin-top:6px}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--soil-dark);background:#fff;padding:0;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;font-weight:800}
.check:hover{border-color:var(--accent)}
.check.on{background:var(--accent);border-color:var(--accent)}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.t-body{flex:1;min-width:0;cursor:pointer}
.t-title{font-weight:600}
.t-meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:2px}
.t-meta .od{color:var(--warn);font-weight:700}
.avatar{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;flex:none}
.tasks-layout{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
.grp-h{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
.grp-h .n{background:#ebe6da;border-radius:999px;padding:0 8px;font-size:11px}
.grp-h.od{color:var(--warn)}
.filters{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.sheet-btns{display:flex;flex-wrap:wrap;gap:6px}
.sheet-btns button{padding:10px 14px}

/* ---- planner ---- */
.planner{display:grid;grid-template-columns:280px 1fr;gap:14px;align-items:start}
.pl-list{display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 170px);overflow:auto;padding-right:2px}
.pl-card{padding:8px 10px;border:1px solid var(--line);border-left:4px solid var(--c,#bbb);border-radius:9px;background:var(--panel);cursor:grab;font-size:13px;user-select:none}
.pl-card.picked{outline:2px solid var(--accent);background:var(--accent-soft)}
.pl-card .m{font-size:11.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.pl-cal{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:auto;max-height:calc(100vh - 170px);box-shadow:var(--shadow)}
.pl-grid{display:grid;grid-template-columns:48px repeat(7,minmax(92px,1fr));min-width:720px}
.pl-dh{position:sticky;top:0;background:var(--panel-2);border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:6px 4px;text-align:center;font-size:12px;font-weight:700;z-index:3}
.pl-dh.today{color:var(--accent);background:var(--accent-soft)}
.pl-dh small{display:block;font-weight:500;color:var(--muted)}
.pl-time{height:48px;font-size:10px;color:var(--muted);text-align:right;padding:0 5px;border-top:1px solid var(--line);position:relative;top:-7px;border:0}
.pl-col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,#ebe5d6 0 1px,transparent 1px 24px)}
.pl-col.over,.pl-col.pick{background-color:#eef5ea}
.pl-col.pick{cursor:copy}
.pl-busy{position:absolute;left:2px;right:2px;background:repeating-linear-gradient(45deg,#ece8de 0 6px,#e2ddd0 6px 12px);border-radius:6px;font-size:10.5px;color:#6f6a5c;padding:2px 5px;overflow:hidden;pointer-events:none}
.pl-ev{position:absolute;left:4px;right:3px;border-radius:6px;background:var(--c);color:#fff;font-size:11px;line-height:1.25;padding:3px 6px;overflow:hidden;cursor:grab;box-shadow:0 1px 3px rgba(0,0,0,.2);z-index:2}
.pl-ev.done{opacity:.55;text-decoration:line-through}
.pl-ev .g{position:absolute;right:4px;bottom:2px;font-size:9px;opacity:.85;font-weight:700}
.pl-now{position:absolute;left:0;right:0;height:2px;background:var(--warn);z-index:2}

/* ---- pages ---- */
.page{padding:22px 28px 40px;width:100%;max-width:1320px}
.page-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.page-head .actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 14px;font-weight:600;color:var(--muted)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);background:none}
.tbl{width:100%;border-collapse:collapse;background:var(--panel);font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--panel-2);position:sticky;top:0}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#f8f3e6}
.tbl-wrap{border:1px solid var(--line);border-radius:12px;overflow:auto;box-shadow:var(--shadow)}
.plants-layout{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
.cat-list{display:flex;flex-direction:column;gap:3px}
.cat-list a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.cat-list a:hover{background:#ece6d6}.cat-list a.on{background:var(--panel);box-shadow:var(--shadow);font-weight:650}
.cat-list a .n{margin-left:auto;font-size:11px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
.stat .v{font-size:22px;font-weight:750;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted)}
.meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.meta div{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
.meta small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
.meta b{font-weight:650}
.cal{display:grid;grid-template-columns:120px repeat(12,1fr);gap:2px;font-size:11px;align-items:center}
.cal .c{height:18px;border-radius:3px;background:#efeadf}
.cal .h{text-align:center;color:var(--muted);font-weight:700}
.tool-card{display:flex;flex-direction:column;gap:8px;cursor:pointer}
.tool-card:hover{border-color:var(--soil-dark)}
.tool-top{display:flex;gap:10px;align-items:flex-start}
.tool-ic{font-size:24px;line-height:1}
.cond{display:flex;height:7px;border-radius:4px;overflow:hidden;background:#eee}
.cond i{display:block}
.drop{border:2px dashed var(--soil-dark);border-radius:12px;padding:16px;text-align:center;color:var(--muted);cursor:pointer;background:var(--panel-2);display:block}
.drop.has{border-style:solid;border-color:var(--accent);color:var(--ink)}
.bar{height:8px;border-radius:4px;background:#ece6d8;overflow:hidden}
.bar i{display:block;height:100%}

.modal{position:fixed;inset:0;background:rgba(30,30,20,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal.hidden{display:none}
.modal-card{background:var(--panel);border-radius:16px;max-width:900px;width:100%;max-height:92vh;overflow:auto;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-card.sm{max-width:600px}
.m-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.m-head .x{margin-left:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;height:100dvh}
  main{grid-row:1}
  .side{grid-row:2;flex-direction:row;padding:4px;gap:0;justify-content:space-around;position:relative;z-index:5}
  .brand,.side-foot{display:none}
  .side a{flex-direction:column;gap:0;padding:6px 2px;font-size:10px;flex:1;text-align:center;position:relative}
  .side a .ic{font-size:19px}
  .side a .cnt{position:absolute;top:2px;right:18%;font-size:9.5px;padding:0 5px}
  #view-map{overflow:auto}
  .map-wrap{grid-template-columns:1fr;grid-template-rows:58vh auto}
  .panel{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .plants-layout,.tasks-layout,.planner{grid-template-columns:minmax(0,1fr)}

/* =========================================================================
   Task engine — tasks are generated from plantings, trees, perennials,
   tool maintenance and manual entries. Status lives in TS by stable id.
   Estimates = base × learned correction factor per task kind.
   ========================================================================= */
const TT = {indoor:{base:20, per:'fixed'}, sow:{base:5, per:'m2'}, plant:{base:8, per:'m2'}, harvest:{base:20, per:'fixed'}, clear:{base:6, per:'m2'}, tree:{base:30, per:'fixed'}, maint:{base:30, per:'fixed'}, custom:{base:30, per:'fixed'}};
const BIAS = {indoor:1.1, sow:.9, plant:1.2, harvest:1, clear:1.35, tree:1.2, maint:.85, custom:1.05};
let TASKS = [], TASK = {}, FACT = {};
const TS = {};
const st = id => TS[id] || (TS[id] = {});
function buildTasks() {
  const T = [];
  for (const p of PLANTINGS) {
    const v = VAR[p.v], b = BED[p.bed]; if (!b) continue;
    const area = areaOf(b) * p.share;
    for (const e of eventsOf(p)) {
      const base = TT[e.t].per === 'm2' ? Math.max(5, Math.round(TT[e.t].base * area)) : TT[e.t].base;
      T.push({id:`${p.id}:${e.t}:${iso(e.d)}`, type:e.t, title:e.label, date:e.d, bed:p.bed, pid:p.id, base});
    }
    v.actions.forEach((a, i) => { for (let y = RANGE.start.getFullYear(); y <= RANGE.end.getFullYear(); y++) {
      const d = new Date(y, a.month - 1, 1, 12);
      if (d >= p.sow && (!p.clear || d < p.clear)) T.push({id:`${p.id}:a${i}:${y}`, type:'tree', title:`${a.title} — ${v.name}`, date:d, bed:p.bed, pid:p.id, base:a.est});
    } });
  }
  for (const tr of TREES) tr.actions.forEach((a, i) => { for (let y = RANGE.start.getFullYear(); y <= RANGE.end.getFullYear(); y++) {
    const d = new Date(y, a.month - 1, 1, 12);
    if (d >= D(tr.planted)) T.push({id:`${tr.id}:a${i}:${y}`, type:'tree', title:`${a.title} — ${tr.name}`, date:d, tree:tr.id, base:a.est || 30});
  } });
  for (const tl of TOOLS) if (tl.interval && tl.last) {
    for (let d = addMonths(D(tl.last), tl.interval); d <= RANGE.end; d = addMonths(d, tl.interval))
      T.push({id:`tool:${tl.id}:${iso(d)}`, type:'maint', title:t('ev.maint', {name:tl.name}), date:d, tool:tl.id, base:tl.maintEst || 30});
  }
  for (const m of MANUAL) T.push({id:m.id, type:'custom', title:m.title, date:m.date, bed:m.bed, where:m.where, base:m.base});
  TASKS = T.sort((a, b) => a.date - b.date);
  TASK = Object.fromEntries(TASKS.map(k => [k.id, k]));
}
function seedTaskState() {
  for (const k of TASKS) {
    if (TS[k.id]) continue;
    const r = hash(k.id);
    if (k.date < addDays(TODAY, -14)) TS[k.id] = {done:true, actual:round5(k.base * BIAS[k.type] * (.85 + r * .3)), who:r < .5 ? 'lien' : 'tom'};
    else TS[k.id] = {who:r < .3 ? 'lien' : r < .55 ? 'tom' : r < .65 ? 'vrijw' : null};
  }
}
function computeFactors() {
  FACT = {};
  for (const type in TT) {
    let a = 0, b = 0, n = 0;
    for (const k of TASKS) { const s = TS[k.id]; if (k.type === type && s && s.done && s.actual) { a += s.actual; b += k.base; n++; } }
    FACT[type] = {f:n >= 2 ? a / b : 1, n};
  }
}
const estOf = k => st(k.id).est ?? round5(k.base * (FACT[k.type]?.f || 1));
function refreshTasks() { buildTasks(); seedTaskState(); computeFactors(); updateNavCount(); }
const siteTag = o => o && SITES.length > 1 ? ` · ${SITE[o.site].name}` : '';
function whereOf(k) {
  if (k.bed) return k.bed + siteTag(BED[k.bed]);
  if (k.tree) return TREE[k.tree] ? TREE[k.tree].name + siteTag(TREE[k.tree]) : '';
  if (k.tool) return TOOL[k.tool].name;
  return k.where || '';
}
function updateNavCount() {

function applyView() { $('#world').setAttribute('transform', `translate(${view.tx},${view.ty}) scale(${view.k})`); }
function worldBounds() {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const add = (a, b, c, d) => { x0 = Math.min(x0, a); y0 = Math.min(y0, b); x1 = Math.max(x1, c); y1 = Math.max(y1, d); };
  [...here(PLOTS), ...here(BEDS), ...here(PATHS), ...here(FEATURES)].forEach(o => add(o.x, o.y, o.x + o.w, o.y + o.h));
  here(TREES).forEach(tr => add(tr.x - tr.crown / 2, tr.y - tr.crown / 2, tr.x + tr.crown / 2, tr.y + tr.crown / 2 + .5));
  return {x:x0 - .8, y:y0 - 1, w:x1 - x0 + 1.6, h:y1 - y0 + 1.8};
}
function fitMap() {
  const r = $('#map-canvas').getBoundingClientRect(); if (!r.width) return;
  const b = worldBounds();
  view.k = Math.min(r.width / b.w, r.height / b.h) * .97;
  view.tx = (r.width - b.w * view.k) / 2 - b.x * view.k;
  view.ty = (r.height - b.h * view.k) / 2 - b.y * view.k;
  view.fitted = true; applyView();
}
function zoomAt(f, mx, my) {
  const k = clamp(view.k * f, 10, 320); f = k / view.k;
  view.tx = mx - (mx - view.tx) * f; view.ty = my - (my - view.ty) * f; view.k = k; applyView();
}
const worldCenter = () => { const r = $('#map-canvas').getBoundingClientRect(); return {x:(r.width / 2 - view.tx) / view.k, y:(r.height / 2 - view.ty) / view.k}; };

function ganttSVG(rows) {
  const W = 380, Lx = 104, R = W - 6, rowH = 22, top = 30, H = top + Math.max(rows.length, 1) * rowH + 6;
  const X = d => Lx + clamp(frac(d), 0, 1) * (R - Lx);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="gantt" data-action="gantt" data-l="${Lx}" data-r="${R}" data-w="${W}">
    <defs><pattern id="g-hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="4" stroke="#9a8a6a" stroke-width="1.4"/></pattern></defs>`;
  for (let y = RANGE.start.getFullYear(); y <= RANGE.end.getFullYear(); y++) {
    const a = X(new Date(y, 0, 1, 12)), b = X(new Date(y + 1, 0, 1, 12));
    s += `<rect x="${a}" y="${top - 12}" width="${b - a}" height="${H - top + 12}" fill="${y % 2 ? '#f3eee2' : '#faf6ec'}"/><text x="${a + 3}" y="12" font-weight="700">${y}</text>`;
    for (let m = 0; m < 12; m++) { const mx = X(new Date(y, m, 1, 12)); s += `<line x1="${mx}" x2="${mx}" y1="${top - 12}" y2="${H}" stroke="#e4ddcc" stroke-width=".6"/>`; if (m % 3 === 0) s += `<text x="${mx + 1}" y="${top - 3}" style="font-size:7px" fill="#8a846f">${M[m][0].toUpperCase()}</text>`; }
  }
  rows.forEach((p, i) => {
    const v = VAR[p.v], c = CAT[v.cat], y = top + i * rowH + 3, h = rowH - 6;
    const warn = WARN.some(w => w.p === p && w.level === 'warn');
    const name = v.name.length > 13 ? v.name.slice(0, 12) + '…' : v.name;
    s += `<text x="4" y="${y + h - 3}">${c.icon} ${esc(name)}${warn ? ' ⚠' : ''}</text>`;
    const seg = (a, b, attrs, title) => { const xa = X(a), xb = X(b); if (xb - xa > .3) s += `<rect x="${xa}" y="${y}" width="${xb - xa}" height="${h}" rx="2" ${attrs}><title>${esc(title)}</title></rect>`; };
    if (v.life === 'perennial') {
      const end = p.clear || RANGE.end;
      seg(p.sow, end, `fill="${c.color}" fill-opacity=".45"`, `${v.name}: ${fmt(p.sow)} → ${p.clear ? fmt(p.clear) : '∞'}`);
      for (let yy = RANGE.start.getFullYear(); yy <= RANGE.end.getFullYear(); yy++) {
        const a = new Date(yy, v.harvest[0] - 1, 1, 12), b = new Date(yy, v.harvest[1], 0, 12);
        if (a >= p.sow && a <= end) seg(a, b < end ? b : end, `fill="${c.color}"`, `${t('ph.harvest')} ${yy}`);
      }
    } else {
      if (p.plant) seg(p.sow, p.plant, `fill="#fff" stroke="${c.color}" stroke-dasharray="2 1.5"`, `${t('ph.indoor')}: ${fmt(p.sow)} → ${fmt(p.plant)}`);
      seg(p.start, p.hs, `fill="${c.color}" fill-opacity=".45"`, `${t('ph.growing')}: ${fmt(p.start)} → ${fmt(p.hs)}`);
      seg(p.hs, p.he, `fill="${c.color}"`, `${t('ph.harvest')}: ${fmt(p.hs)} → ${fmt(p.he)}`);
      seg(p.he, p.clear, `fill="url(#g-hatch)"`, `${t('ph.clearing')}: ${fmt(p.clear)}`);
    }
  });
  s += `<line x1="${X(TODAY)}" x2="${X(TODAY)}" y1="${top - 12}" y2="${H}" stroke="#b9502c" stroke-width="1" stroke-dasharray="2 2"/>`;
  s += `<line x1="${X(state.date)}" x2="${X(state.date)}" y1="${top - 14}" y2="${H}" stroke="#2a2a24" stroke-width="1.6"/>`;
  return s + '</svg>';
}

function renderTasks() {
  const who = state.taskWho, ws = monday(TODAY), nw = addDays(ws, 7), nnw = addDays(ws, 14), end = addDays(TODAY, 60);
  const mine = k => who === 'all' || (who === 'none' ? !st(k.id).who : st(k.id).who === who);
  const open = TASKS.filter(k => !st(k.id).done && mine(k));
  const groups = [
    ['overdue', open.filter(k => k.date < TODAY && k.date >= addDays(TODAY, -60))],
    ['today', open.filter(k => sameDay(k.date, TODAY))],
    ['week', open.filter(k => k.date > TODAY && k.date < nw && !sameDay(k.date, TODAY))],
    ['next', open.filter(k => k.date >= nw && k.date < nnw)],
    ['later', open.filter(k => k.date >= nnw && k.date <= end)],
  ];
  if (state.taskDone) groups.push(['done', TASKS.filter(k => st(k.id).done && mine(k) && k.date >= addDays(TODAY, -30) && k.date <= end).reverse()]);
  const weekTasks = TASKS.filter(k => !st(k.id).done && k.date >= ws && k.date < nw);
  const load = {}; weekTasks.forEach(k => { const w = st(k.id).who || '_'; load[w] = (load[w] || 0) + estOf(k); });
  const totalWeek = Object.values(load).reduce((a, b) => a + b, 0);
  const openCount = groups.slice(0, 5).reduce((a, g) => a + g[1].length, 0);
  const body = groups.map(([g, list]) => list.length ? `<div class="grp-h ${g === 'overdue' ? 'od' : ''}">${t('grp.' + g)} <span class="n">${list.length}</span></div>${list.map(taskRow).join('')}` : '').join('');
  $('#tasks-page').innerHTML = `<div class="page-head"><h1>${t('tasks.title')}</h1><span class="muted">${t('tasks.sub', {n:openCount, d:fmtDur(totalWeek)})}</span>

const PL_START = 7, PL_END = 21, PX_H = 48;
function renderPlanner() {
  const ws = state.plWeek, we = addDays(ws, 7), who = state.plWho, person = PERSON[who];
  const days = [...Array(7)].map((_, i) => addDays(ws, i));
  const unplanned = TASKS.filter(k => { const s = st(k.id); return !s.done && !s.slot && k.date >= addDays(ws, -21) && k.date < addDays(we, 14) && (who === 'all' || !s.who || s.who === who); });
  const sched = TASKS.filter(k => { const s = st(k.id); return s.slot && s.slot.start >= ws && s.slot.start < we && (who === 'all' || s.slot.who === who); });
  const busy = who !== 'all' && person.google ? busyFor(who, ws) : [];
  const top = d => (d.getHours() + d.getMinutes() / 60 - PL_START) * PX_H;
  let cols = '';
  days.forEach((d, i) => {
    let inner = '';
    busy.filter(b => sameDay(b.start, d)).forEach(b => inner += `<div class="pl-busy" style="top:${top(b.start)}px;height:${top(b.end) - top(b.start)}px">${t('pl.busy')} · ${esc(b.label)}</div>`);
    sched.filter(k => sameDay(st(k.id).slot.start, d)).forEach(k => { const s = st(k.id), p = PERSON[s.slot.who];
      inner += `<div class="pl-ev ${s.done ? 'done' : ''}" draggable="true" data-drag="${esc(k.id)}" data-action="task-open" data-id="${esc(k.id)}" style="--c:${p.color};top:${top(s.slot.start)}px;height:${Math.max(20, estOf(k) / 60 * PX_H - 2)}px">
        <b>${hm(s.slot.start)}</b> ${esc(k.title)}${p.google ? '<span class="g">G</span>' : ''}</div>`; });
    if (sameDay(d, TODAY)) { const now = new Date(); const h = now.getHours() + now.getMinutes() / 60; if (h >= PL_START && h <= PL_END) inner += `<div class="pl-now" style="top:${(h - PL_START) * PX_H}px"></div>`; }
    cols += `<div class="pl-col ${state.pick ? 'pick' : ''}" data-day="${i}" style="height:${(PL_END - PL_START) * PX_H}px">${inner}</div>`;
  });
  const times = [...Array(PL_END - PL_START)].map((_, i) => `<div class="pl-time">${pad(PL_START + i)}:00</div>`).join('');
  $('#planner-page').innerHTML = `<div class="page-head"><h1>${t('pl.title')}</h1>
      <div style="display:flex;gap:4px;align-items:center"><button data-action="pl-week" data-d="-7">‹</button><button data-action="pl-week" data-d="0">${t('pl.thisWeek')}</button><button data-action="pl-week" data-d="7">›</button>
      <b style="margin-left:6px">${t('pl.week', {n:isoWeek(ws), a:fmtS(ws), b:fmtS(addDays(ws, 6))})}</b></div>
      <div class="actions"><span class="muted small">${t('pl.cal')}</span>${[...PEOPLE.map(p => [p.id, p.name]), ['all', t('tasks.all')]].map(([id, l]) => `<button class="${who === id ? 'on' : ''}" data-action="pl-who" data-id="${id}">${PERSON[id] ? avatar(PERSON[id]) + ' ' : ''}${esc(l)}</button>`).join('')}
      ${who !== 'all' ? `<span class="chip" style="--c:${person.google ? '#3f7d4e' : '#9a958a'}">${t(person.google ? 'pl.google' : 'pl.noGoogle')}</span>` : ''}<button data-action="pl-ics">${t('pl.ics')}</button></div></div>
    <div class="muted small" style="margin-bottom:10px">${state.pick ? `<b style="color:var(--accent)">${t('pl.pick', {name:esc(TASK[state.pick].title)})}</b>` : t('pl.help')}</div>
    <div class="planner">
      <div><h3 style="margin-top:0">${t('pl.unplanned')} (${unplanned.length})</h3><div class="pl-list">${unplanned.length ? unplanned.map(k => { const s = st(k.id), p = PERSON[s.who];
        return `<div class="pl-card ${state.pick === k.id ? 'picked' : ''}" draggable="true" data-drag="${esc(k.id)}" data-action="pl-pick" data-id="${esc(k.id)}" style="--c:${p ? p.color : '#bbb'}">
          <b>${EV_ICON[k.type]} ${esc(k.title)}</b><div class="m"><span class="${k.date < TODAY ? 'od' : ''}">📅 ${t('pl.due', {d:fmtS(k.date)})}</span><span>⏱ ${fmtDur(estOf(k))}</span>${whereOf(k) ? `<span>📍 ${esc(whereOf(k))}</span>` : ''}${p ? `<span>👤 ${esc(p.name)}</span>` : ''}</div></div>`; }).join('') : `<div class="muted small">${t('pl.none')}</div>`}</div></div>

    col.addEventListener('click', e => { if (state.pick && !e.target.closest('.pl-ev')) { const id = state.pick; state.pick = null; scheduleAt(id, col, e.clientY); } });
  });

function scheduleAt(id, col, clientY) {
  const k = TASK[id]; if (!k) return;
  const y = clientY - col.getBoundingClientRect().top, est = estOf(k);
  let min = PL_START * 60 + Math.floor(y / (PX_H / 4)) * 15;
  min = clamp(min, PL_START * 60, PL_END * 60 - Math.min(est, 60));
  const d = addDays(state.plWeek, +col.dataset.day), s = st(id);
  const who = state.plWho === 'all' ? (s.who || 'lien') : state.plWho;
  const start = new Date(d.getFullYear(), d.getMonth(), d.getDate(), Math.floor(min / 60), min % 60), end = new Date(start.getTime() + est * 60000);
  s.slot = {start, who}; s.who = who;
  const person = PERSON[who];
  const clash = busyFor(who, state.plWeek).some(b => start < b.end && b.start < end);
  renderPlanner(); updateNavCount();
  toast(clash ? t('toast.overlap', {name:person.name}) : t('toast.scheduled', {name:person.name, d:slotTxt(start)}) + (person.google ? t('toast.sync') : ''));
}

function fromAI(o, newCats) {
  const errs = [];
  if (!o.name) errs.push(t('ai.e.name'));
  if (!CAT[o.category] && !newCats.some(c => c.id === o.category)) errs.push(t('ai.e.cat', {c:o.category}));
  const mw = (k, req) => { const w = o[k]; if (w == null) { if (req) errs.push(t('ai.e.missing', {k})); return null; } if (!Array.isArray(w) || w.length !== 2 || w.some(n => !(n >= 1 && n <= 12))) { errs.push(t('ai.e.month', {k})); return null; } return w; };
  const life = o.life === 'perennial' ? 'perennial' : 'annual';
  const v = V(slug(`${o.name || 'x'}-${o.cultivar || ''}`), o.category, o.name || '?', o.cultivar || '', {
    latin:o.latin || '', fam:o.family || undefined, life, depth:+o.sowDepthCm || 0, spacing:+o.spacingInRowCm || 0, row:+o.spacingBetweenRowsCm || 0, height:+o.heightCm || 0,
    sun:Array.isArray(o.sun) && o.sun.length ? o.sun.filter(s => ['full', 'half', 'shade'].includes(s)) : ['full'], sowIndoor:mw('sowIndoorMonths'), indoorWeeks:o.weeksIndoorBeforePlanting || null,
    sowOutdoor:mw('sowOutdoorMonths'), plantOut:mw('plantOutMonths'), germ:Array.isArray(o.germinationDays) ? o.germinationDays : null,
    grow:+o.daysToFirstHarvest || null, hw:+o.harvestWeeks || 4, harvest:mw('harvestMonths', true), maxStay:o.maxYearsInBed === undefined ? 1 : o.maxYearsInBed,
    notes:o.notes || '', suppliers:(o.suppliers || []).filter(s => s && s.name).map(s => S(s.name, +s.price || 0, s.unit || '')),
  });
  if (life === 'annual' && !v.grow) errs.push(t('ai.e.missing', {k:'daysToFirstHarvest'}));
  if (!v.sowIndoor && !v.sowOutdoor && !v.plantOut) errs.push(t('ai.e.window'));
  return {v, errs, exists:!!VAR[v.id]};
}

    refreshTasks(); st(id).who = $('#nt-who').value || null; closeModal(); rerender(); toast(t('toast.taskAdded'));
  },
  'task-unschedule': a => { delete st(a.dataset.id).slot; closeModal(); rerender(); toast(t('toast.unscheduled')); },
  'task-to-planner': a => { const k = TASK[a.dataset.id]; state.plWeek = monday(k.date < TODAY ? TODAY : k.date); state.pick = k.id; closeModal(); showView('planner'); },
  'task-note': a => { closeModal(); focusSite(a.dataset.at); state.bed = a.dataset.at; state.noteForm = true; showView('map'); },
  'pl-week': a => { state.plWeek = +a.dataset.d ? addDays(state.plWeek, +a.dataset.d) : monday(TODAY); renderPlanner(); },
  'pl-who': a => { state.plWho = a.dataset.id; renderPlanner(); },
  'pl-pick': a => { state.pick = state.pick === a.dataset.id ? null : a.dataset.id; renderPlanner(); },
  'pl-ics': exportIcs,
  variety: a => varietyModal(a.dataset.id),
  pcat: a => { state.plantCat = a.dataset.id; renderPlants(); },
  ptab: a => { state.plantTab = a.dataset.id; renderPlants(); },
  'ai-export': aiExportModal,
  'ai-copy': () => copyText($('#ai-prompt').value),
  'inv-ai-copy': () => copyText(t('inv.aiPrompt', {cats:COST_CATS.map(c => `${c.id}: ${c.name}`).join(', ')})),
  'inv-ai-example': () => { $('#inv-ai').value = JSON.stringify({date:iso(TODAY), supplier:'Tuinbouwshop Agri', number:'AG2026-377', total:61.45,
    lines:[{desc:'Druppelslang 2×5 m', category:'infra', amount:14.20}, {desc:'Vliesdoek 2 × 10 m', category:'protect', amount:9.95}, {desc:'Zaaigrond 40 L', category:'soil', amount:8.80}, {desc:'Snoeischaar', category:'tools', amount:21.50}, {desc:'Verzending', category:'other', amount:7.00}]}, null, 2); },
  'inv-ai-fill': () => {
    let o; try { o = JSON.parse($('#inv-ai').value.trim().replace(/^```(json)?|```$/g, '')); } catch (e) { return toast(t('ai.invalid', {e:e.message})); }
    const lines = (o.lines || []).map(l => ({desc:l.desc || '', cat:CC[l.category] ? l.category : 'other', amount:(+l.amount || 0).toFixed(2)}));
    Object.assign(state.inv, {date:o.date || state.inv.date, supplier:o.supplier || '', number:o.number || '', total:(+o.total || 0).toFixed(2), lines:lines.length ? lines : state.inv.lines});
    invoiceForm(); toast(t('toast.invFilled'));
  },
  'ai-import': aiImportModal,
  'ai-example': () => { $('#ai-json').value = AI_EXAMPLE; aiValidate(); },
  'ai-validate': aiValidate,
  'ai-do-import': aiDoImport,
  'cat-export': catalogExport,
  tool: a => toolModal(a.dataset.id),
  'tools-year': a => { state.toolsYear = +a.dataset.y; renderTools(); },
  'cost-year': a => { state.costYear = a.dataset.y; if (a.dataset.y !== 'all' && state.costGroup === 'year') state.costGroup = 'month'; renderCosts(); },
  'cost-group': a => { state.costGroup = a.dataset.g; renderCosts(); },
  invoice: a => invoiceModal(a.dataset.id),
  'add-invoice': () => { state.inv = {date:iso(TODAY), supplier:'', number:'', total:'', file:null, lines:[{desc:'', cat:'seed', amount:''}]}; invoiceForm(); },
  'inv-add-line': () => { state.inv.lines.push({desc:'', cat:'other', amount:''}); invoiceForm(); },
  'inv-del-line': a => { state.inv.lines.splice(+a.dataset.k, 1); invoiceForm(); },
  'inv-rest': () => { const f = state.inv, others = f.lines.slice(0, -1).reduce((s, l) => s + (+l.amount || 0), 0); f.lines[f.lines.length - 1].amount = Math.max(0, (+f.total || 0) - others).toFixed(2); invoiceForm(); },
  'inv-save': () => { const f = state.inv; const inv = {id:'i' + Date.now(), date:f.date, d:D(f.date), supplier:f.supplier, number:f.number || '—', file:f.file, fileUrl:f.fileUrl, fileType:f.fileType,
      lines:f.lines.filter(l => +l.amount).map(l => L(l.desc || CC[l.cat].name, l.cat, +l.amount))}; inv.total = +inv.lines.reduce((s, l) => s + l.amount, 0).toFixed(2);
    INVOICES.push(inv); closeModal(); renderCosts(); toast(t('toast.invSaved')); },
  'modal-close': closeModal,
  'demo-only': () => toast(t('demo.only')),
};
document.addEventListener('click', e => { const a = e.target.closest('[data-action]'); if (!a) return; const fn = ACTIONS[a.dataset.action]; if (fn) { if (a.tagName === 'A') e.preventDefault(); fn(a, e); } });

/* ---- boot ---- */
WARN = computeWarnings(); refreshTasks();
// a few tasks already scheduled in this week's calendar
(() => {
  const ws = monday(TODAY), at = (off, h, m) => { const d = addDays(ws, off); return new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m); };
  Object.assign(st('m1'), {who:'tom', slot:{start:at(5, 10, 0), who:'tom'}});
  Object.assign(st('m7'), {who:'lien', slot:{start:at(Math.min(6, (TODAY.getDay() + 6) % 7 + 1), 17, 30), who:'lien'}});
  Object.assign(st('m2'), {who:'lien'});
})();
applyStatic(); renderTrack(); updateTimeline(); renderLegend(); fitMap(); renderMap(); renderPanel();
</script>
